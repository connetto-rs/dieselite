[package]
name = "dieselite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Diesel tables and models for the SQLite catalog, sqlite_schema and the pragma table-valued functions."
repository = "https://github.com/connetto-rs/dieselite"
documentation = "https://docs.rs/dieselite"
readme = "README.md"
keywords = ["sqlite", "diesel", "catalog", "schema", "introspection"]
categories = ["database"]

[dependencies]
diesel = { version = "2.4", default-features = false, features = ["sqlite"] }
serde = { version = "1", features = ["derive"], optional = true }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlparser = { version = "0.64", features = ["visitor"] }
diesel-dynamic-schema = { version = "0.3", features = ["sqlite"] }
thiserror = "2"

# These patches track upstream main for this crate's own builds.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }
diesel-dynamic-schema = { git = "https://github.com/diesel-rs/diesel", branch = "main" }

[dev-dependencies]
libsqlite3-sys = { version = "0.40", features = ["bundled"] }

[features]
default = ["serde"]
serde = ["dep:serde"]

[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "forbid"
deprecated = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
